name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK (подпись — постоянный публичный app/debug.keystore)
        run: gradle :app:assembleDebug --stacktrace

      - name: Проверить подпись APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | head -5

      - name: Подготовить имя файла
        run: cp app/build/outputs/apk/debug/app-debug.apk Libry-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Libry-debug-apk
          path: Libry-debug.apk
          if-no-files-found: error

      - name: Прикрепить APK к релизу (по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Libry-debug.apk
